<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamezone</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header class="hero">
    <div class="hero-contenido">
        <div class="hero-izquierda">
            <img src="../assets/iconos/logo GameZone.png" alt="GameZone Logo" class="logo">
        </div>

        <div class="hero-texto">
            <h1>GameZone</h1>
            <p>Descubre, comenta y comparte opiniones sobre tus videojuegos favoritos.</p>
        </div>

        <div class="hero-derecha">
            <a href="#" class="login-btn">Login</a>
        </div>

    </div>
</header>

    <main>
        <section class="game-card">
            <a href="minecraft.html" class="game-link">

                <img src="../assets/iconos/Minecraft/portada_minecraft.jpg" alt="Minecraft">
            
                <div class="game-title">
                <h2>Minecraft</h2>
                <span class="rating">★ 4.8</span>
                </div>

                <p>Un juego de construcción, exploración y supervivencia.</p>
            
            </a>

        </section>
    </main>
    
</body>
    
</html>
